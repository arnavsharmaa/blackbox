name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Test, then publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "apps/api[dev]"
      - name: Test
        working-directory: apps/api
        run: pytest -q
      - name: Extract this version's notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" \
            '$0 ~ "^## \\[" ver "\\]" {found=1; next} /^## \[/ {found=0} found' \
            CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "BlackBox $GITHUB_REF_NAME" \
            --notes-file notes.md \
            docs/openapi.json \
            packages/schemas/incident.schema.json
