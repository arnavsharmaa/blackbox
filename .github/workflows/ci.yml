name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs when the same branch is pushed again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "apps/api[dev]"
      - name: Lint
        working-directory: apps/api
        run: ruff check blackbox_api tests
      - name: Type check
        working-directory: apps/api
        run: mypy blackbox_api
      - name: Test
        working-directory: apps/api
        run: pytest -q

  backend-postgres:
    name: Backend on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blackbox
          POSTGRES_PASSWORD: blackbox
          POSTGRES_DB: blackbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "apps/api[dev,postgres]"
      - name: Test against Postgres
        working-directory: apps/api
        env:
          BLACKBOX_TEST_DATABASE_URL: postgresql+psycopg://blackbox:blackbox@localhost:5432/blackbox_test
        run: pytest -q

  frontend:
    name: Frontend (vitest, eslint, tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    name: Docker compose + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health; do sleep 3; done'
      - name: Wait for web
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'
      - name: End-to-end smoke test
        run: python3 scripts/smoke.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install backend
        run: pip install -e "apps/api[dev]"
      - name: Install frontend
        run: npm ci --no-audit --no-fund
      - name: Seed database
        run: python scripts/seed.py
      - name: Start API
        run: |
          nohup python -m uvicorn blackbox_api.main:app --app-dir apps/api --port 8000 > api.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
      - name: Build and start web
        run: |
          npm run build
          nohup npm run start --workspace apps/web > web.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: apps/web
        run: npx playwright test
      - name: Show server logs on failure
        if: failure()
        run: tail -50 api.log web.log
