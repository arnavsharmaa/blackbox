[project]
name = "blackbox-api"
version = "0.1.0"
description = "BlackBox flight recorder and incident reconstruction API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.12",
    "mcap>=1.1",
    "mcap-ros2-support>=0.5",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackbox_api"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = "blackbox_api.storage.models"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
